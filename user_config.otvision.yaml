---
CONVERT:
  PATHS: []
  DELETE_INPUT: false
  FPS_FROM_FILENAME: true
  INPUT_FPS: 20.0
  ROTATION: 0
  OVERWRITE: true
  DETECT_START: null
  DETECT_END: null

DETECT:
  PATHS: []
  FORCE_RELOAD_TORCH_HUB_CACHE: false
  HALF_PRECISION: false
  OVERWRITE: true
  YOLO:
    CONF: 0.25
    IMGSIZE: 640
    IOU: 0.45
    WEIGHTS: yolov8s

TRACK:
  PATHS: []
  TRACKER_TYPE: iou
  IOU:
    SIGMA_H: 0.42
    SIGMA_IOU: 0.38
    SIGMA_L: 0.27
    T_MIN: 5
    T_MISS_MAX: 51
  BOT_SORT:
    T_MIN: 5
    T_MISS_MAX: 51
    track_high_thresh: 0.25
    track_low_thresh: 0.1
    new_track_thresh: 0.25
    match_thresh: 0.8
    fuse_score: true
    gmc_method: sparseOptFlow
    proximity_thresh: 0.5
    appearance_thresh: 0.8
    with_reid: false
    model: auto
  OVERWRITE: true

LOG:
  LOG_LEVEL_CONSOLE: WARNING
  LOG_LEVEL_FILE: DEBUG
