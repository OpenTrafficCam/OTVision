---
CONVERT:
  PATHS: []
  DELETE_INPUT: false
  FPS_FROM_FILENAME: true
  INPUT_FPS: 20.0
  ROTATION: 0
  OVERWRITE: true
  DETECT_START: null
  DETECT_END: null

DETECT:
  PATHS: []
  FORCE_RELOAD_TORCH_HUB_CACHE: false
  HALF_PRECISION: false
  OVERWRITE: true
  YOLO:
    CONF: 0.25
    IMGSIZE: 640
    IOU: 0.45
    WEIGHTS: yolov8s

TRACK:
  PATHS: []
  # Select iou or botsort. The --tracker option overrides this setting.
  # The IOU flags --sigma-l, --sigma-h, --sigma-iou, --t-min and --t-miss-max
  # cannot be combined with BoT-SORT.
  TRACKER_TYPE: iou
  IOU:
    SIGMA_H: 0.42
    SIGMA_IOU: 0.38
    SIGMA_L: 0.27
    T_MIN: 5
    T_MISS_MAX: 51
  BOT_SORT:
    T_MIN: 5  # Minimum track span in frames.
    T_MISS_MAX: 60  # Maximum consecutive missed frames before expiry.
    TRACK_HIGH_THRESH: 0.2  # Minimum confidence for first-stage matching.
    TRACK_LOW_THRESH: 0.1  # Lower confidence bound for second-stage matching.
    NEW_TRACK_THRESH: 0.2  # Minimum confidence to start a track.
    MATCH_THRESH: 0.9  # Maximum cost for first-stage matching.
    FUSE_SCORE: true  # Weight first-stage IoU by detection confidence.
  OVERWRITE: true

LOG:
  LOG_LEVEL_CONSOLE: WARNING
  LOG_LEVEL_FILE: DEBUG
