[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "OTVision"
dynamic = ["version"]
authors = [
  { name="OpenTrafficCam contributors", email="team@opentrafficcam.org" },
  { name="platomo GmbH", email="info@platomo.de" },
]
description = "OTVision is a core module of the OpenTrafficCam framework to perform object detection and tracking."

readme = "README.md"
requires-python = "==3.12.*"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
keywords = ["OpenTrafficCam", "Traffic Analysis", "Traffic Counting", "Trajectories"]
dependencies = [
    "av==13.0.0",
    "coremltools==9.0; sys_platform == 'darwin'",
    "ffmpeg-python==0.2.0",
    "fire==0.7.0",
    "geopandas==1.1.2",
    "ijson==3.3.0",
    "more-itertools==10.7.0",
    "moviepy==1.0.3",
    "numpy==2.3.5; sys_platform != 'win32'",
    "numpy==1.26.4; sys_platform == 'win32'",
    "opencv-python-headless==4.10.0.84",
    "pandas==2.3.3",
    "PyYAML==6.0.2",
    "tqdm==4.67.1",
    "ujson==5.13.0",
]

[dependency-groups]
dev = [
    "interrogate==1.5.0",
    "jsonschema==4.23.0",
    "mypy==1.15.0",
    "pandas-stubs==2.3.2.250926",
    "pre-commit==3.8.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==5.0.0",
    "ruff==0.17.3",
    "twine==6.1.0",
    "types-geopandas==1.1.4.20261006",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20260906",
    "types-tqdm==4.70.0.20260906",
]

[project.optional-dependencies]
inference_cpu = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "ultralytics==8.4.208",
]
inference_cuda = [
    "torch==2.14.1; platform_machine == 'x86_64'",
    "torchvision==0.29.1; platform_machine == 'x86_64'",
    "tensorrt-cu13==11.4.0.106; sys_platform != 'darwin' and platform_machine == 'x86_64'",
    "tensorrt-cu13-bindings==11.4.0.106; sys_platform != 'darwin' and platform_machine == 'x86_64'",
    "tensorrt-cu13-libs==11.4.0.106; sys_platform != 'darwin' and platform_machine == 'x86_64'",
    # TensorRT 11 needs ModelOpt to export FP16/INT8 engines
    "nvidia-modelopt[onnx]==0.48.0; sys_platform != 'darwin' and platform_machine == 'x86_64'",
    "ultralytics==8.4.208; platform_machine == 'x86_64'",
]
[project.urls]
Homepage = "https://opentrafficcam.org/"
Documentation = "https://opentrafficcam.org/overview/"
Repository = "https://github.com/OpenTrafficCam/OTVision"
Issues = "https://github.com/OpenTrafficCam/OTVision/issues"
Changelog = "https://github.com/OpenTrafficCam/OTVision/releases"


[tool.hatch.version]
path = "OTVision/version.py"

[tool.hatch.build.targets.wheel]
packages = ["OTVision"]

[tool.hatch.build]
directory = "dist"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Same checks flake8 ran (E, F, W) plus import sorting.
select = ["E", "F", "W", "I"]

[tool.mypy]
ignore_missing_imports = true
ignore_missing_imports_per_module = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "OTVision.view.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "OTVision.transform.*"
ignore_errors = true

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu13"
requires-dist = ["tensorrt-cu13-bindings", "tensorrt-cu13-libs"]

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu13-libs"
requires-dist = ["nvidia-cuda-runtime==13.0.*"]

[[tool.uv.dependency-metadata]]
name = "nvidia-cuda-runtime"

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu13-bindings"

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu13-libs"

[tool.uv]
exclude-newer = "3 days"
# certifi = false: eMudhra CA compromise (Oct 2026) — certifi ≥ 2026.10.19 required, remove once release clears the 3-day cutoff
exclude-newer-package = { certifi = false, tensorrt-cu13 = false, tensorrt-cu13-bindings = false, tensorrt-cu13-libs = false }
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
conflicts = [
    [
        { extra = "inference_cpu" },
        { extra = "inference_cuda" },
    ],
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" , extra = "inference_cuda" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'", extra="inference_cpu" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'", extra="inference_cpu" }
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" , extra = "inference_cuda" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'", extra="inference_cpu" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'", extra="inference_cpu" }
]
tensorrt-cu13 = { index = "tensorrt", extra = "inference_cuda" }
tensorrt-cu13-bindings = { index = "tensorrt", extra = "inference_cuda" }
tensorrt-cu13-libs = { index = "tensorrt", extra = "inference_cuda" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "tensorrt"
url = "https://pypi.nvidia.com/"
explicit = true
