---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
        exclude_types:
          - json
      - id: trailing-whitespace
      - id: no-commit-to-branch
      - id: debug-statements
      - id: requirements-txt-fixer
      - id: check-executables-have-shebangs
      - id: detect-private-key
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.26
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: ruff-check
        name: Run the ruff linter
        entry: uv run --group dev ruff check
        args: [--fix]
        types: [python]
        language: system
      - id: ruff-format
        name: Run the ruff formatter
        entry: uv run --group dev ruff format
        types: [python]
        language: system
  - repo: local
    hooks:
      - id: mypy
        name: Run mypy
        # The inference extra provides torch and ultralytics, which are checked too.
        entry: uv run --group dev --extra inference_cpu mypy .
        language: system
        types: [python]
        always_run: true
        pass_filenames: false
  - repo: local
    hooks:
      - id: super-linter
        name: Super-linter
        # Docker hook mounts the workspace at /src, so we point super-linter there.
        # Note: when the super-linter version is bumped here, upgrade it in CI too.
        # pre-commit runs the container as the host user, who cannot write to
        # $HOME (/github/home), so Trivy needs a writable cache dir.
        entry: >
          --rm --platform linux/amd64
          --env-file .github/super-linter.env
          --env-file .github/super-linter-fix.env
          -e DEFAULT_WORKSPACE=/src
          -e TRIVY_CACHE_DIR=/tmp/trivy
          -e RUN_LOCAL=true
          -e SAVE_SUPER_LINTER_SUMMARY=true
          -e SUPER_LINTER_OUTPUT_DIRECTORY_NAME=.super-linter
          -e SUPER_LINTER_SUMMARY_FILE_NAME=SUMMARY.md
          ghcr.io/super-linter/super-linter@sha256:c95c714f746edc70e54926a69e229c834ffcdec2450bd3475f7865164d749a56
        language: docker_image
        pass_filenames: false
        stages: [pre-push]
