[project]
name = "otvision-rfdetr-experimental"
version = "0.1.0"
description = "Experimental RF-DETR JIT detection writing OTVision .otdet files"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "opencv-python-headless==4.10.0.84",
    "rfdetr==1.7.1",
    "torch==2.12.0",
    "torchvision==0.27.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
